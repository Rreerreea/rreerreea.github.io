<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>George — Designer's Room</title>
<meta name="description" content="George — UX/UI Designer Portfolio. Explore the designer's room!">
<meta property="og:title" content="George — Designer's Room">
<meta property="og:description" content="Interactive 3D portfolio — drive around a designer's room">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; overflow: hidden; height: 100vh; width: 100vw;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: default; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene-canvas { position: fixed; inset: 0; z-index: 1; }

  /* Loading Screen */
  #loading {
    position: fixed; inset: 0; background: #F5EDE4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 2000; transition: opacity 0.8s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 28px; color: #5C4033; margin-bottom: 8px; font-weight: 700; }
  #loading p { font-size: 14px; color: #A08060; margin-bottom: 32px; }
  .progress-bar {
    width: 200px; height: 4px; background: #E8DED2; border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: #2D7D8A; border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* Name Badge */
  .name-badge {
    position: fixed; top: 20px; left: 24px;
    color: rgba(92,64,51,0.6); font-size: 13px; font-weight: 500;
    z-index: 50; letter-spacing: 0.3px;
  }
  .name-badge strong { color: rgba(92,64,51,0.85); font-size: 15px; }

  /* Controls Hint */
  .controls-hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(44,34,26,0.75); color: #fff; padding: 10px 20px;
    border-radius: 14px; font-size: 13px; display: flex; gap: 16px;
    z-index: 50; transition: opacity 0.8s; backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .controls-hint kbd {
    background: rgba(255,255,255,0.15); padding: 2px 7px;
    border-radius: 4px; font-family: inherit; font-size: 12px;
  }

  /* Progress Bar */
  .zone-progress {
    position: fixed; top: 20px; right: 24px; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    color: rgba(92,64,51,0.6); font-size: 12px; font-weight: 500;
  }
  .zone-progress-dots { display: flex; gap: 4px; }
  .zone-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(92,64,51,0.15); transition: all 0.4s ease;
  }
  .zone-dot.visited { background: #2D7D8A; box-shadow: 0 0 6px rgba(45,125,138,0.4); }

  /* Side Panel */
  .side-panel {
    position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
    background: rgba(245,237,228,0.92); backdrop-filter: blur(20px);
    z-index: 100; transition: right 0.5s cubic-bezier(0.16,1,0.3,1);
    padding: 60px 32px 32px; overflow-y: auto;
    border-left: 1px solid rgba(92,64,51,0.1);
    box-shadow: -20px 0 60px rgba(0,0,0,0.1);
  }
  .side-panel.open { right: 0; }
  .side-panel-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(92,64,51,0.08); border: none;
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #5C4033; transition: background 0.2s;
  }
  .side-panel-close:hover { background: rgba(92,64,51,0.15); }
  .side-panel h2 {
    font-size: 22px; color: #2C3E6B; margin-bottom: 6px; font-weight: 700;
    opacity: 0; transform: translateY(12px);
    transition: all 0.4s ease 0.1s;
  }
  .side-panel.open h2 { opacity: 1; transform: translateY(0); }
  .side-panel .subtitle {
    font-size: 13px; color: #A08060; margin-bottom: 20px;
    opacity: 0; transform: translateY(12px);
    transition: all 0.4s ease 0.15s;
  }
  .side-panel.open .subtitle { opacity: 1; transform: translateY(0); }
  .side-panel .card {
    background: #fff; border-radius: 14px; padding: 18px;
    margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    border: 1px solid rgba(92,64,51,0.06);
    opacity: 0; transform: translateY(16px);
    transition: all 0.4s ease;
    cursor: pointer;
  }
  .side-panel.open .card { opacity: 1; transform: translateY(0); }
  .side-panel .card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border-color: rgba(45,125,138,0.2);
  }
  .side-panel .card h3 {
    font-size: 15px; color: #333; margin-bottom: 4px; font-weight: 600;
  }
  .side-panel .card p {
    font-size: 13px; color: #888; line-height: 1.5;
  }
  .side-panel .card .tag {
    display: inline-block; background: rgba(45,125,138,0.1); color: #2D7D8A;
    font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-top: 6px; font-weight: 500;
  }
  .side-panel .skill-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .side-panel .skill-item {
    background: #fff; border-radius: 10px; padding: 14px;
    border: 1px solid rgba(92,64,51,0.06);
    opacity: 0; transform: translateY(16px);
    transition: all 0.4s ease;
  }
  .side-panel.open .skill-item { opacity: 1; transform: translateY(0); }
  .side-panel .skill-item .skill-icon { font-size: 20px; margin-bottom: 6px; }
  .side-panel .skill-item h4 { font-size: 13px; color: #333; font-weight: 600; }
  .side-panel .skill-item p { font-size: 11px; color: #999; margin-top: 2px; }
  .side-panel .contact-link {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 10px; border: 1px solid rgba(92,64,51,0.06);
    text-decoration: none; color: #333;
    opacity: 0; transform: translateY(16px);
    transition: all 0.4s ease;
  }
  .side-panel.open .contact-link { opacity: 1; transform: translateY(0); }
  .side-panel .contact-link:hover { border-color: #2D7D8A; }
  .side-panel .contact-link .contact-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .side-panel .about-text {
    color: #555; line-height: 1.7; font-size: 14px;
    opacity: 0; transform: translateY(12px);
    transition: all 0.4s ease 0.2s;
  }
  .side-panel.open .about-text { opacity: 1; transform: translateY(0); }
  .side-panel .tool-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .side-panel .tool-item {
    background: #fff; border-radius: 10px; padding: 14px; text-align: center;
    border: 1px solid rgba(92,64,51,0.06);
    opacity: 0; transform: translateY(16px);
    transition: all 0.4s ease;
  }
  .side-panel.open .tool-item { opacity: 1; transform: translateY(0); }
  .side-panel .tool-item .tool-icon { font-size: 28px; margin-bottom: 6px; }
  .side-panel .tool-item h4 { font-size: 13px; color: #333; font-weight: 600; }

  /* Stagger delays for cards */
  .side-panel .card:nth-child(2) { transition-delay: 0.15s; }
  .side-panel .card:nth-child(3) { transition-delay: 0.2s; }
  .side-panel .card:nth-child(4) { transition-delay: 0.25s; }
  .side-panel .card:nth-child(5) { transition-delay: 0.3s; }
  .side-panel .card:nth-child(6) { transition-delay: 0.35s; }
  .side-panel .card:nth-child(7) { transition-delay: 0.4s; }
  .side-panel .card:nth-child(8) { transition-delay: 0.45s; }
  .side-panel .card:nth-child(9) { transition-delay: 0.5s; }
  .side-panel .skill-item:nth-child(2) { transition-delay: 0.2s; }
  .side-panel .skill-item:nth-child(3) { transition-delay: 0.25s; }
  .side-panel .skill-item:nth-child(4) { transition-delay: 0.3s; }
  .side-panel .skill-item:nth-child(5) { transition-delay: 0.35s; }
  .side-panel .skill-item:nth-child(6) { transition-delay: 0.4s; }
  .side-panel .tool-item:nth-child(2) { transition-delay: 0.2s; }
  .side-panel .tool-item:nth-child(3) { transition-delay: 0.25s; }
  .side-panel .tool-item:nth-child(4) { transition-delay: 0.3s; }
  .side-panel .tool-item:nth-child(5) { transition-delay: 0.35s; }
  .side-panel .tool-item:nth-child(6) { transition-delay: 0.4s; }
  .side-panel .contact-link:nth-child(2) { transition-delay: 0.2s; }
  .side-panel .contact-link:nth-child(3) { transition-delay: 0.25s; }
  .side-panel .contact-link:nth-child(4) { transition-delay: 0.3s; }

  /* Virtual Joystick (mobile) */
  #joystick-zone {
    position: fixed; bottom: 0; left: 0; width: 50%; height: 50%;
    z-index: 60; display: none; touch-action: none;
  }
  #joystick-base {
    position: absolute; bottom: 60px; left: 60px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
    display: none;
  }
  #joystick-thumb {
    position: absolute; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  #action-btn {
    position: fixed; bottom: 80px; right: 40px;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(45,125,138,0.8); border: 2px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 14px; font-weight: 700;
    z-index: 60; display: none; cursor: pointer;
    backdrop-filter: blur(8px);
  }

  #debug-info {
    position: fixed; top: 60px; left: 12px;
    color: rgba(92,64,51,0.5); font-size: 11px; font-family: monospace;
    z-index: 50; display: none;
  }
  body.debug #debug-info { display: block; }

  @media (max-width: 768px) {
    .side-panel { width: 100%; right: -110%; }
    .controls-hint { display: none; }
    #joystick-zone, #action-btn { display: block; }
    .name-badge { top: 12px; left: 12px; }
    .zone-progress { top: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div id="loading">
  <h1>Designer's Room</h1>
  <p>Loading the workspace...</p>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="name-badge"><strong>George</strong> — UX/UI Designer</div>
<canvas id="scene-canvas"></canvas>

<div class="controls-hint" id="hint">
  <span><kbd>WASD</kbd> Drive</span>
  <span><kbd>Space</kbd> Brake</span>
  <span><kbd>Shift</kbd> Boost</span>
  <span><kbd>E</kbd> Interact</span>
  <span><kbd>Scroll</kbd> Zoom</span>
</div>

<div class="zone-progress" id="zone-progress">
  <div class="zone-progress-dots" id="zone-dots"></div>
  <span id="zone-count">0/5</span>
</div>

<div class="side-panel" id="side-panel">
  <button class="side-panel-close" id="panel-close">&times;</button>
  <div id="panel-body"></div>
</div>

<div id="joystick-zone">
  <div id="joystick-base">
    <div id="joystick-thumb"></div>
  </div>
</div>
<button id="action-btn">E</button>

<div id="debug-info"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ═══════════════════════════════════════════
// CONCEPT: Detailed desk = play arena.
// Simplified room visible around/below.
// Fall off desk → respawn.
// ═══════════════════════════════════════════

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

// ─── OUTLINE SHADER ───
const OutlineShader = {
  uniforms: {
    tDiffuse: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    lineWidth: { value: 1.0 },
    lineColor: { value: new THREE.Vector3(0.15, 0.12, 0.2) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float lineWidth; uniform vec3 lineColor;
    varying vec2 vUv;
    float lum(vec4 c){ return dot(c.rgb,vec3(0.299,0.587,0.114)); }
    void main(){
      vec2 t=vec2(lineWidth)/resolution;
      float tl=lum(texture2D(tDiffuse,vUv+vec2(-t.x,t.y)));
      float tt=lum(texture2D(tDiffuse,vUv+vec2(0,t.y)));
      float tr=lum(texture2D(tDiffuse,vUv+vec2(t.x,t.y)));
      float l=lum(texture2D(tDiffuse,vUv+vec2(-t.x,0)));
      float r=lum(texture2D(tDiffuse,vUv+vec2(t.x,0)));
      float bl=lum(texture2D(tDiffuse,vUv+vec2(-t.x,-t.y)));
      float bb=lum(texture2D(tDiffuse,vUv+vec2(0,-t.y)));
      float br=lum(texture2D(tDiffuse,vUv+vec2(t.x,-t.y)));
      float sx=tl+2.0*l+bl-tr-2.0*r-br;
      float sy=tl+2.0*tt+tr-bl-2.0*bb-br;
      float e=smoothstep(0.05,0.25,sqrt(sx*sx+sy*sy));
      vec4 c=texture2D(tDiffuse,vUv);
      c.rgb=mix(c.rgb,lineColor,e*0.7);
      gl_FragColor=c;
    }`
};

// ─── DOM ───
const hint = document.getElementById('hint');
const canvas = document.getElementById('scene-canvas');
const loadingEl = document.getElementById('loading');
const progressFill = document.getElementById('progress-fill');
const debugInfo = document.getElementById('debug-info');
const sidePanel = document.getElementById('side-panel');
const panelBody = document.getElementById('panel-body');
const panelClose = document.getElementById('panel-close');
const zoneDots = document.getElementById('zone-dots');
const zoneCount = document.getElementById('zone-count');
const actionBtn = document.getElementById('action-btn');

// ─── RENDERER ───
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ─── TOON ───
const toonGradient = new THREE.DataTexture(
  new Uint8Array([160, 210, 255]), 3, 1, THREE.LuminanceFormat
);
toonGradient.minFilter = THREE.NearestFilter;
toonGradient.magFilter = THREE.NearestFilter;
toonGradient.needsUpdate = true;

function toonMat(color) {
  return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient });
}
function addShadows(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// ─── PALETTE ───
const P = {
  deskTop: 0xD4B896, deskEdge: 0xC4A87A, deskLeg: 0xA08060,
  floorRoom: 0x8B7355, wallLower: 0xD4C4B0, wallUpper: 0xF5EDE4,
  baseboard: 0x5C4033, molding: 0xC4B09A,
  woodDark: 0x5C4033, woodMed: 0xA08060, metal: 0xC0C0C8,
  teal: 0x2D7D8A, coral: 0xE87461, yellow: 0xF2D06B, green: 0x7CB68A, navy: 0x2C3E6B,
};

// ─── SCENE + CAMERA ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xE8DED2);
scene.fog = new THREE.Fog(0xE8DED2, 50, 90);

const camera = new THREE.PerspectiveCamera(isMobile ? 50 : 40, window.innerWidth / window.innerHeight, 0.5, 120);
camera.position.set(0, 30, 35);

// ─── POST-PROCESSING ───
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (!isMobile) composer.addPass(new ShaderPass(OutlineShader));

// ─── LIGHTS ───
scene.add(new THREE.AmbientLight(0xFFF8E8, 1.5));

const keyLight = new THREE.DirectionalLight(0xFFF8E8, 1.6);
keyLight.position.set(-8, 25, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(isMobile ? 512 : 1024, isMobile ? 512 : 1024);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -20; keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20; keyLight.shadow.camera.bottom = -20;
keyLight.shadow.bias = -0.002;
scene.add(keyLight); scene.add(keyLight.target);

scene.add(new THREE.DirectionalLight(0xD0D8FF, 0.4).translateX(10).translateY(12));
scene.add(new THREE.DirectionalLight(0xFFD0A0, 0.25).translateX(-5).translateY(8).translateZ(-12));

// ─── PHYSICS ───
const world = new CANNON.World();
world.gravity.set(0, -15, 0);
world.allowSleep = true;
world.broadphase = new CANNON.SAPBroadphase(world);

const floorMat = new CANNON.Material('floor');
const wheelMat = new CANNON.Material('wheel');
const dummyMat = new CANNON.Material('dummy');

world.defaultContactMaterial.friction = 0;
world.defaultContactMaterial.restitution = 0.2;
world.addContactMaterial(new CANNON.ContactMaterial(floorMat, dummyMat, { friction: 0.05, restitution: 0.3 }));
world.addContactMaterial(new CANNON.ContactMaterial(dummyMat, dummyMat, { friction: 0.5, restitution: 0.3 }));
world.addContactMaterial(new CANNON.ContactMaterial(floorMat, wheelMat, { friction: 0.3, restitution: 0 }));

// ═══════════════════════════════════════════
// DESK — 28x28 play surface at y=0
// ═══════════════════════════════════════════
const DESK = 28, DHALF = DESK / 2;
const DESK_THICK = 0.4;
const DESK_Y = 0; // top surface of desk
const LEG_H = 4;  // desk legs height (room floor at y = -LEG_H - DESK_THICK/2)
const ROOM_FLOOR_Y = -(LEG_H + DESK_THICK);

// ─── Desk surface (flat top, car drives on this) ───
const deskMesh = addShadows(new THREE.Mesh(
  new THREE.BoxGeometry(DESK, DESK_THICK, DESK),
  toonMat(P.deskTop)
));
deskMesh.position.y = DESK_Y - DESK_THICK / 2;
deskMesh.receiveShadow = true;
scene.add(deskMesh);

// Edge profile — darker inset strip below desk edge to simulate rounding
const edgeStripMat = toonMat(P.deskEdge);
const edgeFront = addShadows(new THREE.Mesh(new THREE.BoxGeometry(DESK + 0.1, 0.15, 0.25), edgeStripMat));
edgeFront.position.set(0, DESK_Y - DESK_THICK - 0.075, DHALF - 0.12);
scene.add(edgeFront);
const edgeBack = addShadows(new THREE.Mesh(new THREE.BoxGeometry(DESK + 0.1, 0.15, 0.25), edgeStripMat));
edgeBack.position.set(0, DESK_Y - DESK_THICK - 0.075, -DHALF + 0.12);
scene.add(edgeBack);
const edgeLeft = addShadows(new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, DESK + 0.1), edgeStripMat));
edgeLeft.position.set(-DHALF + 0.12, DESK_Y - DESK_THICK - 0.075, 0);
scene.add(edgeLeft);
const edgeRight = addShadows(new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, DESK + 0.1), edgeStripMat));
edgeRight.position.set(DHALF - 0.12, DESK_Y - DESK_THICK - 0.075, 0);
scene.add(edgeRight);

// Beveled edge highlight (thin bright strip at top edge)
const bevelMat = toonMat(0xE0C8A8);
[
  [0, DESK_Y - 0.01, DHALF + 0.01, DESK + 0.2, 0.03, 0.06],
  [0, DESK_Y - 0.01, -DHALF - 0.01, DESK + 0.2, 0.03, 0.06],
  [-DHALF - 0.01, DESK_Y - 0.01, 0, 0.06, 0.03, DESK + 0.2],
  [DHALF + 0.01, DESK_Y - 0.01, 0, 0.06, 0.03, DESK + 0.2],
].forEach(([x, y, z, sx, sy, sz]) => {
  const bev = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), bevelMat);
  bev.position.set(x, y, z);
  scene.add(bev);
});

// ─── Desk physics (the surface car drives on) ───
const deskBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Box(new CANNON.Vec3(DHALF, DESK_THICK / 2, DHALF)),
  position: new CANNON.Vec3(0, DESK_Y - DESK_THICK / 2, 0),
  material: floorMat,
});
world.addBody(deskBody);

// ─── Pedestal dimensions ───
const PED_W = 4;
const PED_D = 2.5;
const PED_H = LEG_H;
const PED_TOP_Y = DESK_Y - DESK_THICK;
const PED_CENTER_Y = PED_TOP_Y - PED_H / 2;
const PED_BACK_Z = -DHALF + PED_D / 2;

const pedMat = toonMat(P.deskLeg);
const drawerFaceMat = toonMat(0xB89878);
const knobMat = toonMat(P.metal);
const DRAWER_H = 1.8;
const DRAWER_GAP = 0.15;

// Left pedestal
const leftPedX = -DHALF + 1 + PED_W / 2;

const dynamicObjects = [];
const loader = new GLTFLoader();
let loadProgress = 0;
const TOTAL_MODELS = 5;

function updateProgress() {
  loadProgress++;
  progressFill.style.width = Math.min(100, Math.round((loadProgress / TOTAL_MODELS) * 100)) + '%';
  if (loadProgress >= TOTAL_MODELS) {
    setTimeout(() => { loadingEl.classList.add('hidden'); gameState = 'intro'; startIntro(); }, 300);
  }
}
setTimeout(() => { if (gameState === 'loading') { loadingEl.classList.add('hidden'); gameState = 'playing'; } }, 12000);

function makePushable(group, shape, mass, px, py, pz, ry = 0) {
  scene.add(group);
  group.position.set(px, py, pz);
  if (ry) group.rotation.y = ry;
  const body = new CANNON.Body({
    mass, shape,
    position: new CANNON.Vec3(px, py, pz),
    material: dummyMat,
    allowSleep: true, sleepSpeedLimit: 0.2, sleepTimeLimit: 1,
  });
  if (ry) body.quaternion.setFromEuler(0, ry, 0);
  world.addBody(body);
  dynamicObjects.push({ mesh: group, body });
  return body;
}

  scene.add(macbookModel);
  macbookModel.position.y += DESK_Y;

  const fBox = new THREE.Box3().setFromObject(macbookModel);

function makeGroundLabel(text) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 512, 128);
  ctx.fillStyle = 'rgba(100,80,50,0.12)';
  ctx.font = 'bold 56px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(cv);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(7, 1.8),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = DESK_Y + 0.02;
  return mesh;
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function makeSprite(text) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 80;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(44,34,26,0.8)';
  rrect(ctx, 4, 4, 248, 72, 14); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 128, 35);
  ctx.font = '14px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('E \u2014 open', 128, 58);
  const tex = new THREE.CanvasTexture(cv);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(3.5, 1.1, 1);
  sprite.visible = false;
  scene.add(sprite);
  return sprite;
}

const AudioMgr = {
  ctx: null, initialized: false, engineOsc: null, engineGain: null,
  init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.initialized = true;
    this.engineOsc = this.ctx.createOscillator();
    this.engineGain = this.ctx.createGain();
    this.engineOsc.type = 'sawtooth'; this.engineOsc.frequency.value = 60;
    this.engineGain.gain.value = 0;
    this.engineOsc.connect(this.engineGain);
    this.engineGain.connect(this.ctx.destination);
    this.engineOsc.start();
  },
  updateEngine(speed, boost) {
    if (!this.initialized) return;
    const f = 60 + Math.abs(speed) * 600 + (boost ? 100 : 0);
    const v = Math.min(0.04, Math.abs(speed) * 0.3);
    this.engineOsc.frequency.linearRampToValueAtTime(f, this.ctx.currentTime + 0.05);
    this.engineGain.gain.linearRampToValueAtTime(v, this.ctx.currentTime + 0.05);
  },
  playNote(freq, dur = 0.15, vol = 0.06) {
    if (!this.initialized) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur);
  },
  zoneChime(i) {
    const n = [523.25, 587.33, 659.25, 783.99, 880];
    this.playNote(n[i%5], 0.4, 0.08);
    setTimeout(() => this.playNote(n[(i+2)%5], 0.3, 0.05), 100);
  },
  fallSound() { this.playNote(200, 0.3, 0.05); setTimeout(() => this.playNote(150, 0.4, 0.04), 100); },
  respawnSound() { this.playNote(523, 0.15, 0.06); setTimeout(() => this.playNote(659, 0.15, 0.06), 80); },
  slideIn() { this.playNote(400, 0.1, 0.03); setTimeout(() => this.playNote(500, 0.1, 0.03), 50); },
  slideOut() { this.playNote(500, 0.1, 0.03); setTimeout(() => this.playNote(400, 0.1, 0.03), 50); },
};
let audioActivated = false;
function activateAudio() { if (!audioActivated) { audioActivated = true; AudioMgr.init(); } }
document.addEventListener('click', activateAudio);
document.addEventListener('keydown', activateAudio);
document.addEventListener('touchstart', activateAudio);

  let jTouchId = null, jStartX = 0, jStartY = 0;
  jZone.addEventListener('touchstart', e => {
    activateAudio();
    const t = e.changedTouches[0]; jTouchId = t.identifier; jStartX = t.clientX; jStartY = t.clientY;

    for (const t of e.changedTouches) {
      if (t.identifier !== jTouchId) continue;
      let dx = t.clientX-jStartX, dy = t.clientY-jStartY;
      const dist = Math.sqrt(dx*dx+dy*dy), max = 50;
      if (dist > max) { dx *= max/dist; dy *= max/dist; }
      jThumb.style.left = (60+dx)+'px'; jThumb.style.top = (60+dy)+'px'; jThumb.style.transform = 'translate(-50%,-50%)';
      joystick.dx = dx/max; joystick.dy = dy/max; joystick.active = true;
    }
    e.preventDefault();
  }, { passive: false });
  const endJ = e => { for (const t of e.changedTouches) { if (t.identifier !== jTouchId) continue; jTouchId = null; joystick.active = false; joystick.dx = 0; joystick.dy = 0; jBase.style.display = 'none'; } };
  jZone.addEventListener('touchend', endJ);
  jZone.addEventListener('touchcancel', endJ);
  actionBtn.addEventListener('touchstart', e => { e.preventDefault(); interact(); }, { passive: false });
}

// ═══════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════
function openPanel(id) {
  if (!panelContents[id]) return;
  panelBody.innerHTML = panelContents[id];
  sidePanel.classList.add('open'); panelOpen = true;
  AudioMgr.slideIn();
}
function closePanel() {
  sidePanel.classList.remove('open'); panelOpen = false;
  AudioMgr.slideOut();
}
function interact() {
  if (nearbyZone) {
    if (!visitedZones.has(nearbyZone.id)) {
      visitedZones.add(nearbyZone.id);
      emitSparkles(nearbyZone.x, DESK_Y + 1, nearbyZone.z, 15);
      updateZoneProgress();
      AudioMgr.zoneChime(interactiveZones.indexOf(nearbyZone));
    }
    openPanel(nearbyZone.content);
  }
}
panelClose.addEventListener('click', closePanel);
document.addEventListener('click', e => {
  if (panelOpen && !sidePanel.contains(e.target) && e.target !== actionBtn) closePanel();
});

// ═══════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════
let gameState = 'loading';
const cameraAngle = new THREE.Vector3(1.135, 1.15, 1.45);
const cameraTarget = new THREE.Vector3(0, 0, 10);
let zoomDist = isMobile ? 18 : 16;
const ZOOM_MIN = isMobile ? 12 : 10;
const ZOOM_MAX = isMobile ? 30 : 28;

// ─── Intro animation ───
const introState = { startCamY: 45, endCamY: 0, duration: 2.5, elapsed: 0 };
function startIntro() {
  gameState = 'intro'; introState.elapsed = 0;
  const dir = cameraAngle.clone().normalize().multiplyScalar(zoomDist);
  introState.endCamY = car.y + dir.y;
}

// ═══════════════════════════════════════════
// UPDATE LOOP
// ═══════════════════════════════════════════
const clock = new THREE.Clock();
let smokeTimer = 0, hintHidden = false;

function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

function update() {
  requestAnimationFrame(update);
  const dt = Math.min(clock.getDelta(), 0.05);
  const dtMs = dt * 1000;
  const time = clock.elapsedTime;

  if (gameState === 'loading') { composer.render(); return; }

  // ─── INTRO ───
  if (gameState === 'intro') {
    introState.elapsed += dt;
    const t = Math.min(introState.elapsed / introState.duration, 1);
    const e = easeInOutCubic(t);
    const dir = cameraAngle.clone().normalize().multiplyScalar(zoomDist);
    camera.position.set(car.x + dir.x, introState.startCamY + (introState.endCamY - introState.startCamY) * e, car.z + dir.z);
    camera.lookAt(car.x, car.y, car.z);
    if (t >= 1) { gameState = 'playing'; cameraTarget.set(car.x, car.y, car.z); }
    composer.render();
    return;
  }

  // ─── CAR CONTROLS ───
  if (gameState === 'playing' && !panelOpen && carModel && !car.falling) {
    let accel, reverse, steerL, steerR, brake, boost;
    if (isMobile && joystick.active) {
      accel = joystick.dy < -0.2; reverse = joystick.dy > 0.3;
      steerL = joystick.dx < -0.2; steerR = joystick.dx > 0.2;
      brake = false; boost = false;
    } else {
      accel = keys['ArrowUp']||keys['w']||keys['\u0446'];
      reverse = keys['ArrowDown']||keys['s']||keys['\u044b'];
      steerL = keys['ArrowLeft']||keys['a']||keys['\u0444'];
      steerR = keys['ArrowRight']||keys['d']||keys['\u0432'];
      brake = keys[' ']; boost = keys['Shift'];
    }
    const maxSpd = boost ? car.maxSpeedBoost : car.maxSpeed;
    if (accel) car.speed = Math.min(car.speed + car.accel, maxSpd);
    else if (reverse) car.speed = Math.max(car.speed - car.accel, -maxSpd * 0.35);
    if (brake) car.speed *= car.brakeDecel;
    else if (!accel && !reverse) car.speed *= car.decel;
    if (Math.abs(car.speed) < 0.0005) car.speed = 0;

    const sf = Math.min(Math.abs(car.speed) / car.maxSpeed, 1);
    if (steerL) car.steer = Math.min(car.steer + car.steerSpeed * dtMs, car.steerMax);
    else if (steerR) car.steer = Math.max(car.steer - car.steerSpeed * dtMs, -car.steerMax);
    else {
      if (car.steer > 0) car.steer = Math.max(0, car.steer - car.steerSpeed * car.steerReturn * dtMs);
      else car.steer = Math.min(0, car.steer + car.steerSpeed * car.steerReturn * dtMs);
    }
    car.angle += car.steer * sf * (car.speed >= 0 ? 1 : -1);
    car.x += Math.sin(car.angle) * car.speed;
    car.z += Math.cos(car.angle) * car.speed;

    // Check if off desk edge
    if (Math.abs(car.x) > DHALF + 0.5 || Math.abs(car.z) > DHALF + 0.5) {
      car.falling = true;
      car.fallVel = 0;
      AudioMgr.fallSound();
    }

    AudioMgr.updateEngine(car.speed, boost);

    // Smoke
    smokeTimer += dt;
    if (brake && Math.abs(car.speed) > 0.05 && smokeTimer > 0.05) {
      smokeTimer = 0;
      const bx = car.x - Math.sin(car.angle)*0.8, bz = car.z - Math.cos(car.angle)*0.8;
      emitSmoke(bx, car.y, bz);
      emitSmoke(bx + (Math.random()-0.5)*0.3, car.y, bz + (Math.random()-0.5)*0.3);
    }

    if (!hintHidden && Math.abs(car.speed) > 0.01) {
      hintHidden = true; setTimeout(() => { hint.style.opacity = '0'; }, 3000);
    }
  }

  // ─── FALLING ───
  if (car.falling) {
    car.fallVel += 20 * dt; // gravity
    car.y -= car.fallVel * dt;
    // Respawn when fallen far enough
    if (car.y < ROOM_FLOOR_Y - 2) {
      AudioMgr.respawnSound();
      respawnCar();
    }
  } else {
    car.y = DESK_Y;
  }

  // Update car visual + physics
  if (carModel) {
    carModel.position.set(car.x, car.y, car.z);
    carModel.rotation.y = car.angle;
    if (car.falling) {
      carModel.rotation.x += dt * 2; // tumble
    }
  }
  if (!car.falling) {
    const vx = (car.x - carBody.position.x) / Math.max(dt, 0.001);
    const vz = (car.z - carBody.position.z) / Math.max(dt, 0.001);
    carBody.velocity.set(vx, 0, vz);
    carBody.position.set(car.x, car.y + 0.35, car.z);
    carBody.quaternion.setFromEuler(0, car.angle, 0);
  }

  // ─── PHYSICS ───
  world.step(1/60, dt, 3);

  // ─── SYNC DYNAMIC OBJECTS ───
  dynamicObjects.forEach(({ mesh, body }) => {
    if (body.position.y < ROOM_FLOOR_Y - 5) {
      if (!body._removed) { world.removeBody(body); mesh.visible = false; body._removed = true; }
      return;
    }
    mesh.position.set(body.position.x, body.position.y, body.position.z);
    mesh.quaternion.set(body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w);
  });

  // ─── SMOKE ───
  smokePool.forEach(p => {
    if (p.life <= 0) return;
    p.life -= dt / p.maxLife;
    p.mesh.position.x += p.vx*dt; p.mesh.position.y += p.vy*dt; p.mesh.position.z += p.vz*dt;
    p.mesh.scale.setScalar(0.3 + (1-p.life)*0.8);
    p.mesh.material.opacity = p.life * 0.4;
    if (p.life <= 0) p.mesh.visible = false;
  });

  // ─── SPARKLES ───
  sparklePool.forEach(p => {
    if (p.life <= 0) return;
    p.life -= dt * 1.5;
    p.mesh.position.x += p.vx*dt; p.mesh.position.y += p.vy*dt; p.mesh.position.z += p.vz*dt;
    p.mesh.rotation.y += dt * 5;
    p.mesh.material.opacity = p.life;
    p.mesh.scale.setScalar(p.life * 0.8);
    if (p.life <= 0) p.mesh.visible = false;
  });

  // ─── DUST ───
  dustParticles.forEach(dp => {
    dp.mesh.position.y = dp.baseY + Math.sin(time * dp.speed + dp.phase) * 0.5;
    dp.mesh.position.x += dp.drift * dt;
    dp.mesh.material.opacity = 0.15 + Math.sin(time * 0.5 + dp.phase) * 0.1;
  });

  // ─── ZONE SPRITES ───
  nearbyZone = null;
  for (const zone of interactiveZones) {
    const dx = car.x - zone.x, dz = car.z - zone.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < zone.radius && !car.falling) {
      nearbyZone = zone;
      zone.sprite.visible = true;
      zone.sprite.position.set(zone.x, DESK_Y + 3, zone.z);
      const pulse = 1 + Math.sin(time * 4) * 0.05;
      zone.sprite.scale.set(3.5*pulse, 1.1*pulse, 1);
      if (isMobile) actionBtn.style.display = 'block';
    } else {
      zone.sprite.visible = false;
    }
  }
  if (!nearbyZone && isMobile) actionBtn.style.display = 'none';

  // ─── GROUND LABELS ───
  groundLabelMeshes.forEach(gl => {
    const dx = car.x - gl.baseX, dz = car.z - gl.baseZ;
    const dist = Math.sqrt(dx*dx + dz*dz);
    const near = Math.max(0, 1 - dist / 12);
    gl.mesh.material.opacity = 0.12 + near * 0.5;
    const pulse = 1 + near * Math.sin(time * 3) * 0.05;
    gl.mesh.scale.set(pulse, pulse, 1);
  });

  // ─── CAMERA ───
  if (!car.falling) {
    cameraTarget.x += (car.x - cameraTarget.x) * 0.15;
    cameraTarget.y += (car.y - cameraTarget.y) * 0.15;
    cameraTarget.z += (car.z - cameraTarget.z) * 0.15;
  }
  const dir = cameraAngle.clone().normalize().multiplyScalar(zoomDist);
  camera.position.set(cameraTarget.x + dir.x, cameraTarget.y + dir.y, cameraTarget.z + dir.z);
  camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);

  keyLight.position.set(car.x - 8, 25, car.z + 8);
  keyLight.target.position.set(car.x, DESK_Y, car.z);
  keyLight.target.updateMatrixWorld();

  // ─── DEBUG ───
  if (document.body.classList.contains('debug')) {
    debugInfo.textContent = `Car: (${car.x.toFixed(1)}, ${car.z.toFixed(1)}) y=${car.y.toFixed(1)} spd=${car.speed.toFixed(3)} falling=${car.falling} bodies=${world.bodies.length} zones=${visitedZones.size}/5`;
  }

  composer.render();
}

update();
</script>
