  <!-- Arms -->
  <rect x="22" y="52" width="15" height="8" rx="4" fill="#6366f1"/>
  <rect x="83" y="52" width="15" height="8" rx="4" fill="#6366f1"/>
  <!-- Feet -->
  <rect x="40" y="95" width="14" height="10" rx="5" fill="#4f46e5"/>
  <rect x="66" y="95" width="14" height="10" rx="5" fill="#4f46e5"/>
