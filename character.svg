  <circle cx="60" cy="32" r="22" fill="#fbbf24"/>
  <!-- Eyes -->
  <circle cx="52" cy="29" r="3" fill="#1e1b4b"/>
  <circle cx="68" cy="29" r="3" fill="#1e1b4b"/>
