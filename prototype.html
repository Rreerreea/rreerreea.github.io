<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>George — UX/UI Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8d5b7; overflow: hidden; height: 100vh; width: 100vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: default; user-select: none;
  }
  #scene-canvas { position: fixed; inset: 0; z-index: 1; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; padding: 40px;
    max-width: 620px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    animation: modalIn 0.3s ease-out;
  }
  @keyframes modalIn {
    from { transform: scale(0.92) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal h2 { font-size: 24px; margin-bottom: 16px; color: #111; }
  .modal p { color: #555; line-height: 1.7; margin-bottom: 10px; font-size: 15px; }
  .modal-close {
    float: right; background: #f3f4f6; border: none;
    width: 34px; height: 34px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #e5e7eb; }
  .case-list { list-style: none; padding: 0; margin: 12px 0; }
  .case-list li {
    padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
    color: #333; font-size: 15px;
  }
  .case-list li:hover { background: #f0f0ff; border-color: #818cf8; color: #4338ca; }
  .case-list li span { color: #999; font-size: 13px; display: block; margin-top: 2px; }

  .controls-hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff; padding: 10px 20px;
    border-radius: 14px; font-size: 13px; display: flex; gap: 16px;
    z-index: 50; transition: opacity 0.8s; backdrop-filter: blur(8px);
  }
  .controls-hint kbd {
    background: rgba(255,255,255,0.15); padding: 2px 7px;
    border-radius: 4px; font-family: inherit; font-size: 12px;
  }
  .name-badge {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(120,100,70,0.5); font-size: 14px; font-weight: 500;
    z-index: 50; letter-spacing: 0.5px;
  }
  .name-badge strong { color: rgba(100,80,50,0.7); font-size: 16px; }
  #loading {
    position: fixed; inset: 0; background: #e8d5b7;
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; color: #8a7560; font-size: 16px; transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #debug-info {
    position: fixed; top: 60px; left: 12px;
    color: rgba(100,80,50,0.5); font-size: 11px; font-family: monospace;
    z-index: 50; display: none;
  }
  body.debug #debug-info { display: block; }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════
// OUTLINE SHADER
// ═══════════════════════════════════════════
const OutlineShader = {
  uniforms: {
    tDiffuse: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    lineWidth: { value: 1.0 },
    lineColor: { value: new THREE.Vector3(0.15, 0.12, 0.2) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float lineWidth; uniform vec3 lineColor;
    varying vec2 vUv;
    float lum(vec4 c){ return dot(c.rgb,vec3(0.299,0.587,0.114)); }
    void main(){
      vec2 t=vec2(lineWidth)/resolution;
      float tl=lum(texture2D(tDiffuse,vUv+vec2(-t.x,t.y)));
      float tt=lum(texture2D(tDiffuse,vUv+vec2(0,t.y)));
      float tr=lum(texture2D(tDiffuse,vUv+vec2(t.x,t.y)));
      float l=lum(texture2D(tDiffuse,vUv+vec2(-t.x,0)));
      float r=lum(texture2D(tDiffuse,vUv+vec2(t.x,0)));
      float bl=lum(texture2D(tDiffuse,vUv+vec2(-t.x,-t.y)));
      float bb=lum(texture2D(tDiffuse,vUv+vec2(0,-t.y)));
      float br=lum(texture2D(tDiffuse,vUv+vec2(t.x,-t.y)));
      float sx=tl+2.0*l+bl-tr-2.0*r-br;
      float sy=tl+2.0*tt+tr-bl-2.0*bb-br;
      float e=smoothstep(0.05,0.25,sqrt(sx*sx+sy*sy));
      vec4 c=texture2D(tDiffuse,vUv);
      c.rgb=mix(c.rgb,lineColor,e*0.7);
      gl_FragColor=c;
    }`
};

// ═══════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════
const hint = document.getElementById('hint');
const modalOverlay = document.getElementById('modal-overlay');
const modalBody = document.getElementById('modal-body');
const modalClose = document.getElementById('modal-close');
const canvas = document.getElementById('scene-canvas');
const loadingEl = document.getElementById('loading');
const debugInfo = document.getElementById('debug-info');

// ═══════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ═══════════════════════════════════════════
// TOON SYSTEM
// ═══════════════════════════════════════════
const toonGradient = new THREE.DataTexture(
  new Uint8Array([180, 220, 255]), 3, 1, THREE.LuminanceFormat
);
toonGradient.minFilter = THREE.NearestFilter;
toonGradient.magFilter = THREE.NearestFilter;
toonGradient.needsUpdate = true;

function toToon(obj) {
  obj.traverse(c => {
    if (!c.isMesh || !c.material) return;
    const mats = Array.isArray(c.material) ? c.material : [c.material];
    const newMats = mats.map(m => {
      if (m.emissive && m.emissive.r + m.emissive.g + m.emissive.b > 0.1) return m;
      if (m.map) return m;
      return new THREE.MeshToonMaterial({ color: m.color || new THREE.Color(0xcccccc), gradientMap: toonGradient, side: m.side });
    });
    c.material = Array.isArray(c.material) ? newMats : newMats[0];
  });
}

function addShadows(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// ═══════════════════════════════════════════
// SCENE + CAMERA
// ═══════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8d5b7);
scene.fog = new THREE.Fog(0xe8d5b7, 60, 110);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 80);
camera.position.set(0, 35, 45);

const orbitControls = new OrbitControls(camera, canvas);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.1;
orbitControls.enabled = false;
canvas.style.pointerEvents = 'none';
let orbitMode = false;

// ═══════════════════════════════════════════
// POST-PROCESSING
// ═══════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// ═══════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════
scene.add(new THREE.AmbientLight(0xffffff, 1.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(-8, 25, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -22;
keyLight.shadow.camera.right = 22;
keyLight.shadow.camera.top = 22;
keyLight.shadow.camera.bottom = -22;
keyLight.shadow.bias = -0.002;
scene.add(keyLight);
scene.add(keyLight.target);

// ═══════════════════════════════════════════
// PHYSICS WORLD
// ═══════════════════════════════════════════
const world = new CANNON.World();
world.gravity.set(0, -10, 0);
world.allowSleep = true;
world.broadphase = new CANNON.SAPBroadphase(world);

const floorMaterial = new CANNON.Material('floor');
const wheelMaterial = new CANNON.Material('wheel');
const dummyMaterial = new CANNON.Material('dummy');

world.defaultContactMaterial.friction = 0;
world.defaultContactMaterial.restitution = 0.2;

world.addContactMaterial(new CANNON.ContactMaterial(floorMaterial, dummyMaterial, {
  friction: 0.05, restitution: 0.3, contactEquationStiffness: 1000,
}));
world.addContactMaterial(new CANNON.ContactMaterial(dummyMaterial, dummyMaterial, {
  friction: 0.5, restitution: 0.3, contactEquationStiffness: 1000,
}));
world.addContactMaterial(new CANNON.ContactMaterial(floorMaterial, wheelMaterial, {
  friction: 0.3, restitution: 0, contactEquationStiffness: 1000,
}));

// ═══════════════════════════════════════════
// DESK (28×28) + WALLS
// ═══════════════════════════════════════════
const DESK_SIZE = 28;
const DESK_HALF = DESK_SIZE / 2;
const WALL_H = 0.6;
const WALL_THICK = 0.3;

const deskMesh = addShadows(new THREE.Mesh(
  new THREE.BoxGeometry(DESK_SIZE, 0.4, DESK_SIZE),
  new THREE.MeshToonMaterial({ color: 0xd4b896, gradientMap: toonGradient })
));
deskMesh.position.y = -0.2;
deskMesh.receiveShadow = true;
scene.add(deskMesh);

const edgeMesh = new THREE.Mesh(
  new THREE.BoxGeometry(DESK_SIZE + 0.3, 0.12, DESK_SIZE + 0.3),
  new THREE.MeshToonMaterial({ color: 0xc4a87a, gradientMap: toonGradient })
);
edgeMesh.position.y = -0.42;
edgeMesh.receiveShadow = true;
scene.add(edgeMesh);

// Desk legs
const legGeo = new THREE.CylinderGeometry(0.35, 0.35, 3, 8);
const legMat = new THREE.MeshToonMaterial({ color: 0xc4a87a, gradientMap: toonGradient });
const lOff = DESK_HALF - 1;
[[-lOff,-lOff],[lOff,-lOff],[-lOff,lOff],[lOff,lOff]].forEach(([x,z]) => {
  const leg = addShadows(new THREE.Mesh(legGeo, legMat));
  leg.position.set(x, -1.9, z);
  scene.add(leg);
});

// Physics desk
const deskBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Box(new CANNON.Vec3(DESK_HALF, 0.2, DESK_HALF)),
  position: new CANNON.Vec3(0, -0.2, 0),
  material: floorMaterial,
});
world.addBody(deskBody);

// ─── WALLS (visual + physics) ───
const wallMat = new THREE.MeshToonMaterial({ color: 0xc4a87a, gradientMap: toonGradient });
const wallConfigs = [
  { px: 0,         pz: -DESK_HALF, sx: DESK_SIZE, sz: WALL_THICK },  // back
  { px: 0,         pz:  DESK_HALF, sx: DESK_SIZE, sz: WALL_THICK },  // front
  { px: -DESK_HALF, pz: 0,         sx: WALL_THICK, sz: DESK_SIZE },  // left
  { px:  DESK_HALF, pz: 0,         sx: WALL_THICK, sz: DESK_SIZE },  // right
];
wallConfigs.forEach(({ px, pz, sx, sz }) => {
  const mesh = addShadows(new THREE.Mesh(
    new THREE.BoxGeometry(sx, WALL_H, sz), wallMat
  ));
  mesh.position.set(px, WALL_H / 2, pz);
  scene.add(mesh);

  const body = new CANNON.Body({
    type: CANNON.Body.STATIC,
    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, WALL_H / 2, sz / 2)),
    position: new CANNON.Vec3(px, WALL_H / 2, pz),
    material: dummyMaterial,
  });
  world.addBody(body);
});

// ═══════════════════════════════════════════
// SYNC ARRAYS
// ═══════════════════════════════════════════
const dynamicObjects = [];
const pinData = [];
const blockData = [];

// ═══════════════════════════════════════════
// HELPER: create pushable object
// ═══════════════════════════════════════════
function makePushable(group, shape, mass, px, py, pz, ry = 0) {
  scene.add(group);
  group.position.set(px, py, pz);
  if (ry !== 0) group.rotation.y = ry;
  const body = new CANNON.Body({
    mass, shape,
    position: new CANNON.Vec3(px, py, pz),
    allowSleep: true, sleepSpeedLimit: 0.2, sleepTimeLimit: 1,
  });
  if (ry !== 0) body.quaternion.setFromEuler(0, ry, 0);
  world.addBody(body);
  dynamicObjects.push({ mesh: group, body });
  return body;
}

// ═══════════════════════════════════════════

// --- Pencils (GLB) ---
loader.load('/pencils.glb', (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const scale = 3 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);

  const sBox = new THREE.Box3().setFromObject(model);
  const center = sBox.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -sBox.min.y, -center.z);

  const g = new THREE.Group();
  g.add(model);
  g.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});

  const fBox = new THREE.Box3().setFromObject(g);
  const fSize = fBox.getSize(new THREE.Vector3());
  makePushable(g, new CANNON.Box(new CANNON.Vec3(fSize.x/2, fSize.y/2, fSize.z/2)), 1.5, 8, fSize.y/2, -8);
  checkAllLoaded();
}, undefined, (err) => { console.error('Pencils:', err); checkAllLoaded(); });

// --- Succulent Plant ---
(function() {
  const g = new THREE.Group();
  g.add(addShadows(new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.5, 0.8, 16),
    new THREE.MeshStandardMaterial({ color: 0xc4714a, roughness: 0.7 })
  )));
  const soil = new THREE.Mesh(
    new THREE.CircleGeometry(0.55, 16),
    new THREE.MeshStandardMaterial({ color: 0x6d4b3f })

  soil.rotation.x = -Math.PI / 2; soil.position.y = 0.4;

  for (let i = 0; i < 8; i++) {

  top.position.y = 0.75; g.add(top);
  makePushable(g, new CANNON.Cylinder(0.6, 0.5, 1.2, 8), 2, 2.4, 0.6, -10);

// --- Sticky Notes ---
const stickyColors = [0xfde68a, 0xa5d8ff, 0xfca5a5, 0xbbf7d0];
[{ dx: -1, dz: -1, r: -0.1 }, { dx: 1, dz: -0.5, r: 0.15 },

// ═══════════════════════════════════════════
// BOWLING PINS (InstancedMesh)
// ═══════════════════════════════════════════
function triPositions(cx, cz, spacing, rows) {
  const p = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c <= r; c++)
      p.push({ x: cx + (c - r / 2) * spacing, z: cz + r * spacing });
  return p;
}

// ═══════════════════════════════════════════
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function makeSprite(text) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 80;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  rrect(ctx, 4, 4, 248, 72, 14); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 128, 35);
  ctx.font = '14px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('E — открыть', 128, 58);
  const tex = new THREE.CanvasTexture(cv);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false })
  );
  sprite.scale.set(3.5, 1.1, 1);
  sprite.visible = false;
  scene.add(sprite);
  return sprite;
}

// ═══════════════════════════════════════════
// UPDATE LOOP
// ═══════════════════════════════════════════
const clock = new THREE.Clock();
let smokeTimer = 0;
let hintHidden = false;

function update() {
  requestAnimationFrame(update);
  const dt = Math.min(clock.getDelta(), 0.05);
  const dtMs = dt * 1000;

  if (gameState === 'loading') { composer.render(); return; }

  // ─── CAR CONTROLS (Bruno-style incremental steering) ───
  if (gameState === 'playing' && !modalOpen && carModel) {
    const accel = keys['ArrowUp'] || keys['w'] || keys['ц'];
    const reverse = keys['ArrowDown'] || keys['s'] || keys['ы'];
    const steerL = keys['ArrowLeft'] || keys['a'] || keys['ф'];
    const steerR = keys['ArrowRight'] || keys['d'] || keys['в'];
    const brake = keys[' '];
    const boost = keys['Shift'];

    const maxSpd = boost ? car.maxSpeedBoost : car.maxSpeed;

    // Acceleration
    if (accel) car.speed = Math.min(car.speed + car.accel, maxSpd);
    else if (reverse) car.speed = Math.max(car.speed - car.accel, -maxSpd * 0.35);

    // Friction / braking
    if (brake) car.speed *= car.brakeDecel;
    else if (!accel && !reverse) car.speed *= car.decel;
    if (Math.abs(car.speed) < 0.0005) car.speed = 0;

    // Steering (incremental + self-centering)
    const speedFactor = Math.min(Math.abs(car.speed) / car.maxSpeed, 1);
    if (steerL) car.steer = Math.min(car.steer + car.steerSpeed * dtMs, car.steerMax);
    else if (steerR) car.steer = Math.max(car.steer - car.steerSpeed * dtMs, -car.steerMax);
    else {
      // Self-center
      if (car.steer > 0) car.steer = Math.max(0, car.steer - car.steerSpeed * car.steerReturn * dtMs);
      else car.steer = Math.min(0, car.steer + car.steerSpeed * car.steerReturn * dtMs);
    }

    // Apply steering to angle (only when moving)
    car.angle += car.steer * speedFactor * (car.speed >= 0 ? 1 : -1);

    // Move
    car.x += Math.sin(car.angle) * car.speed;
    car.z += Math.cos(car.angle) * car.speed;
    car.y += (0 - car.y) * 0.15;

    // Clamp to desk bounds (walls handle physics, this is visual safety)
    const bound = DESK_HALF - 1;
    car.x = Math.max(-bound, Math.min(bound, car.x));
    car.z = Math.max(-bound, Math.min(bound, car.z));

    // Update visual
    carModel.position.set(car.x, car.y, car.z);
    carModel.rotation.y = car.angle;

    // Physics body follows car (for pushing objects)
    const vx = (car.x - carBody.position.x) / Math.max(dt, 0.001);
    const vz = (car.z - carBody.position.z) / Math.max(dt, 0.001);
    carBody.velocity.set(vx, 0, vz);
    carBody.position.set(car.x, car.y + 0.35, car.z);
    carBody.quaternion.setFromEuler(0, car.angle, 0);

    // Smoke when braking at speed
    smokeTimer += dt;
    if (brake && Math.abs(car.speed) > 0.05 && smokeTimer > 0.05) {
      smokeTimer = 0;
      const bx = car.x - Math.sin(car.angle) * 0.8;
      const bz = car.z - Math.cos(car.angle) * 0.8;
      emitSmoke(bx, car.y, bz);
      emitSmoke(bx + (Math.random() - 0.5) * 0.3, car.y, bz + (Math.random() - 0.5) * 0.3);
    }

    // Hide hint
    if (!hintHidden && Math.abs(car.speed) > 0.01) {
      hintHidden = true;
      setTimeout(() => { hint.style.opacity = '0'; }, 3000);
    }
  }

  // ─── PHYSICS STEP ───
  if (gameState !== 'loading') {
    world.step(1 / 60, dt, 3);
  }

  // ─── SYNC DYNAMIC OBJECTS ───
  dynamicObjects.forEach(({ mesh, body }) => {
    if (body.position.y < -10) {
      if (!body._removed) { world.removeBody(body); mesh.visible = false; body._removed = true; }
      return;
    }
    mesh.position.set(body.position.x, body.position.y, body.position.z);
    mesh.quaternion.set(body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w);
  });

  let pinsNeedUpdate = false;
  pinData.forEach((pin, i) => {
    if (!pin.alive) return;
    if (pin.body.position.y < -10) {
      world.removeBody(pin.body); pin.alive = false;
      _dummy.scale.set(0, 0, 0); _dummy.updateMatrix();
      pinMesh.setMatrixAt(i, _dummy.matrix);
      stripeMesh.setMatrixAt(i, _dummy.matrix);
      pinsNeedUpdate = true; return;
    }
    _dummy.position.copy(pin.body.position);
    _dummy.quaternion.copy(pin.body.quaternion);
    _dummy.scale.set(1, 1, 1);
    _dummy.updateMatrix();
    pinMesh.setMatrixAt(i, _dummy.matrix);
    const so = new THREE.Vector3(0, 0.1, 0);
    so.applyQuaternion(_dummy.quaternion);
    _dummy.position.add(so);
    _dummy.updateMatrix();
    stripeMesh.setMatrixAt(i, _dummy.matrix);
    pinsNeedUpdate = true;
  });
  if (pinsNeedUpdate) {
    pinMesh.instanceMatrix.needsUpdate = true;
    stripeMesh.instanceMatrix.needsUpdate = true;
  }

  let blocksNeedUpdate = false;
  blockData.forEach((blk, i) => {
    if (!blk.alive) return;
    if (blk.body.position.y < -10) {
      world.removeBody(blk.body); blk.alive = false;
      _dummy.scale.set(0, 0, 0); _dummy.updateMatrix();
      blockMesh.setMatrixAt(i, _dummy.matrix);
      blocksNeedUpdate = true; return;
    }
    _dummy.position.copy(blk.body.position);
    _dummy.quaternion.copy(blk.body.quaternion);
    _dummy.scale.set(1, 1, 1);
    _dummy.updateMatrix();
    blockMesh.setMatrixAt(i, _dummy.matrix);
    blocksNeedUpdate = true;
  });
  if (blocksNeedUpdate) blockMesh.instanceMatrix.needsUpdate = true;

  // ─── SMOKE PARTICLES ───
  smokePool.forEach(p => {
    if (p.life <= 0) return;
    p.life -= dt / p.maxLife;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    const t = 1 - p.life;
    p.mesh.scale.setScalar(0.3 + t * 0.8);
    p.mesh.material.opacity = p.life * 0.4;
    if (p.life <= 0) p.mesh.visible = false;
  });

  // ─── CAMERA (Bruno-style isometric lerp) ───
  if (!orbitMode) {
    cameraTarget.x += (car.x - cameraTarget.x) * 0.15;
    cameraTarget.y += (car.y - cameraTarget.y) * 0.15;
    cameraTarget.z += (car.z - cameraTarget.z) * 0.15;

    const dir = cameraAngle.clone().normalize().multiplyScalar(zoomDist);
    camera.position.set(
      cameraTarget.x + dir.x,
      cameraTarget.y + dir.y,
      cameraTarget.z + dir.z
    );
    camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);

    keyLight.position.set(car.x - 8, 25, car.z + 8);
    keyLight.target.position.set(car.x, 0, car.z);
    keyLight.target.updateMatrixWorld();
  } else {
    orbitControls.update();
  }

  // ─── SPRITES ───
  nearbyZone = null;
  for (const zone of interactiveZones) {
    const dx = car.x - zone.x, dz = car.z - zone.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < zone.radius) {
      nearbyZone = zone;
      zone.sprite.visible = true;
      zone.sprite.position.set(zone.x, 3, zone.z);
      const pulse = 1 + Math.sin(Date.now() * 0.004) * 0.05;
      zone.sprite.scale.set(3.5 * pulse, 1.1 * pulse, 1);
    } else {
      zone.sprite.visible = false;
    }
  }

  // ─── GROUND LABELS ───
  groundLabelMeshes.forEach(gl => {
    const dx = car.x - gl.baseX, dz = car.z - gl.baseZ;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const near = Math.max(0, 1 - dist / 12);
    gl.mesh.material.opacity = 0.15 + near * 0.6;
    const pulse = 1 + near * Math.sin(Date.now() * 0.003) * 0.05;
    gl.mesh.scale.set(pulse, pulse, 1);
  });

  // ─── DEBUG ───
  if (document.body.classList.contains('debug')) {
    debugInfo.textContent = `Car: (${car.x.toFixed(1)}, ${car.z.toFixed(1)}) spd=${car.speed.toFixed(3)} steer=${car.steer.toFixed(3)} bodies=${world.bodies.length}`;
  }

  composer.render();
}

update();
</script>

</html>
