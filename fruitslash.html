<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Slash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: none; user-select: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Config ───────────────────────────────────────────────
const GRAVITY      = 0.35;
const MAX_MISSES   = 3;
const TRAIL_LEN    = 24;
const BASE_INTERVAL = 1300; // ms between spawns (decreases over time)

// ─── State ────────────────────────────────────────────────
let fruits, halves, particles, popups, trail;
let score, misses, gameOver, lastSpawn, startTime;
let missFlash = 0; // 0..1 red vignette on miss
let mx = 0, my = 0, pmx = 0, pmy = 0;

const TYPES = [
  { bg: '#e63946', shine: '#ff6b6b', label: '🍎' },
  { bg: '#f4a261', shine: '#ffbe76', label: '🍊' },
  { bg: '#f7d060', shine: '#ffe08a', label: '🍋' },
  { bg: '#57cc99', shine: '#80ed99', label: '🍏' },
  { bg: '#e63f89', shine: '#ff79b0', label: '🍓' },
  { bg: '#9b5de5', shine: '#c77dff', label: '🍇' },
  { bg: '#f72585', shine: '#ff70b2', label: '🍑' },
  { bg: '#06d6a0', shine: '#52efca', label: '🥝' },
];

// ─── Fruit ────────────────────────────────────────────────
class Fruit {
  constructor() {
    this.r  = 34;
    this.x  = Math.random() * (W - 240) + 120;
    this.y  = H + this.r + 10;
    this.vx = (Math.random() - 0.5) * 5;
    this.vy = -(Math.random() * 7 + 13);
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.06;
    const t = TYPES[Math.floor(Math.random() * TYPES.length)];
    this.bg = t.bg; this.shine = t.shine; this.label = t.label;
    this.alive = true;
  }
  update() {
    this.vy += GRAVITY;
    this.x += this.vx; this.y += this.vy;
    this.rot += this.rotV;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowColor = this.bg;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.bg;
    ctx.fill();
    ctx.shadowBlur = 0;
    // top-left shine
    ctx.beginPath();
    ctx.arc(-this.r * 0.28, -this.r * 0.28, this.r * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fill();
    // emoji
    ctx.font = `${this.r * 1.15}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.label, 0, 2);
    ctx.restore();
  }
  offScreen() { return this.y > H + this.r * 2; }
}

// ─── Half (sliced piece) ──────────────────────────────────
class Half {
  constructor(x, y, bg, dir) {
    this.x = x; this.y = y;
    this.r = 34;
    this.bg = bg;
    this.vx = dir * (Math.random() * 5 + 3);
    this.vy = -(Math.random() * 3 + 1);
    this.rot = Math.random() * Math.PI;
    this.rotV = dir * (Math.random() * 0.12 + 0.04);
    this.alpha = 1;
    this.dir = dir; // -1 = left half, +1 = right half
  }
  update() {
    this.vy += GRAVITY * 0.8;
    this.x += this.vx; this.y += this.vy;
    this.rot += this.rotV;
    this.alpha -= 0.014;
  }
  draw() {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    // semicircle: left half = PI/2 to 3PI/2, right = -PI/2 to PI/2
    const a0 = this.dir < 0 ? Math.PI / 2 : -Math.PI / 2;
    const a1 = this.dir < 0 ? 3 * Math.PI / 2 : Math.PI / 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = this.bg;
    ctx.fill();
    // inner juicy layer
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.62, a0, a1);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,200,0.35)';
    ctx.fill();
    ctx.restore();
  }
  done() { return this.alpha <= 0 || this.y > H + 80; }
}

// ─── Particle (juice drop) ────────────────────────────────
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 10;
    this.vy = Math.random() * -7 - 1;
    this.r = Math.random() * 5 + 2;
    this.alpha = 1;
  }
  update() {
    this.vy += 0.25;
    this.x += this.vx; this.y += this.vy;
    this.alpha -= 0.035; this.r *= 0.96;
  }
  draw() {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.restore();
  }
  done() { return this.alpha <= 0; }
}

// ─── Score popup ──────────────────────────────────────────
class Popup {
  constructor(x, y, text, color) {
    this.x = x; this.y = y; this.text = text;
    this.color = color || 'white';
    this.alpha = 1; this.vy = -2.2;
  }
  update() { this.y += this.vy; this.vy *= 0.92; this.alpha -= 0.025; }
  draw() {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = this.color;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 8;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
  done() { return this.alpha <= 0; }
}

// ─── Init ─────────────────────────────────────────────────
function init() {
  fruits = []; halves = []; particles = []; popups = []; trail = [];
  score = 0; misses = 0; gameOver = false;
  lastSpawn = performance.now(); startTime = performance.now();
  missFlash = 0;
}
init();

// ─── Input ────────────────────────────────────────────────
function onMove(x, y) {
  pmx = mx; pmy = my; mx = x; my = y;
  trail.push({ x, y, t: Date.now() });
  if (trail.length > TRAIL_LEN) trail.shift();
  if (!gameOver) checkSlice(pmx, pmy, x, y);
}
canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  onMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('click', () => { if (gameOver) init(); });
canvas.addEventListener('touchend', () => { if (gameOver) init(); });

// ─── Slice detection ──────────────────────────────────────
function lineCircle(x1, y1, x2, y2, cx, cy, cr) {
  const dx = x2 - x1, dy = y2 - y1;
  const fx = x1 - cx, fy = y1 - cy;
  const a = dx*dx + dy*dy;
  if (a < 0.001) return false;
  const b = 2*(fx*dx + fy*dy);
  const c = fx*fx + fy*fy - cr*cr;
  const disc = b*b - 4*a*c;
  if (disc < 0) return false;
  const sd = Math.sqrt(disc);
  const t1 = (-b - sd) / (2*a);
  const t2 = (-b + sd) / (2*a);
  return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1) || (t1 < 0 && t2 > 1);
}

function checkSlice(x1, y1, x2, y2) {
  if (Math.hypot(x2-x1, y2-y1) < 4) return;
  for (const f of fruits) {
    if (!f.alive) continue;
    if (lineCircle(x1, y1, x2, y2, f.x, f.y, f.r)) slice(f);
  }
}

function slice(f) {
  f.alive = false;
  score++;
  halves.push(new Half(f.x, f.y, f.bg, -1));
  halves.push(new Half(f.x, f.y, f.bg,  1));
  for (let i = 0; i < 14; i++) particles.push(new Particle(f.x, f.y, f.bg));
  popups.push(new Popup(f.x, f.y - f.r - 10, '+1', '#fff'));
}

// ─── Spawn ────────────────────────────────────────────────
function maybeSpawn(now) {
  const elapsed = (now - startTime) / 1000;
  const interval = Math.max(600, BASE_INTERVAL - elapsed * 8);
  if (now - lastSpawn < interval) return;
  lastSpawn = now;
  const count = Math.random() < 0.25 ? 2 : 1;
  for (let i = 0; i < count; i++) fruits.push(new Fruit());
}

// ─── Draw trail ───────────────────────────────────────────
function drawTrail() {
  if (trail.length < 2) return;
  const now = Date.now();
  ctx.save();
  for (let i = 1; i < trail.length; i++) {
    const age = (now - trail[i].t) / 220;
    const a = Math.max(0, 1 - age);
    if (a <= 0) continue;
    const w = (i / trail.length) * 7 + 1;
    ctx.beginPath();
    ctx.moveTo(trail[i-1].x, trail[i-1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `rgba(255,250,180,${a * 0.95})`;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#fff0a0';
    ctx.shadowBlur = 18;
    ctx.stroke();
  }
  ctx.restore();
}

// ─── Draw UI ──────────────────────────────────────────────
function drawUI() {
  // Score
  ctx.save();
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'white';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 12;
  ctx.fillText(score, 30, 28);
  ctx.restore();

  // Lives
  ctx.save();
  ctx.font = '34px serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  for (let i = 0; i < MAX_MISSES; i++) {
    ctx.fillText(i < MAX_MISSES - misses ? '❤️' : '🖤', W - 26 - i * 46, 28);
  }
  ctx.restore();
}

function drawBg() {
  const grad = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.5, Math.max(W, H) * 0.75);
  grad.addColorStop(0, '#0f1b2d');
  grad.addColorStop(1, '#050810');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawMissFlash() {
  if (missFlash <= 0) return;
  const grad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, Math.max(W, H)*0.8);
  grad.addColorStop(0, 'rgba(200,0,0,0)');
  grad.addColorStop(1, `rgba(200,0,0,${missFlash * 0.55})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = 'bold 76px Arial';
  ctx.fillStyle = '#ff3344';
  ctx.shadowColor = '#ff0022';
  ctx.shadowBlur = 40;
  ctx.fillText('GAME OVER', W/2, H/2 - 64);

  ctx.font = 'bold 50px Arial';
  ctx.fillStyle = 'white';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 14;
  ctx.fillText(`Score: ${score}`, W/2, H/2 + 12);

  ctx.font = '26px Arial';
  ctx.fillStyle = '#888';
  ctx.shadowBlur = 0;
  ctx.fillText('Click (or tap) to play again', W/2, H/2 + 82);
}

// ─── Main loop ────────────────────────────────────────────
function loop(now) {
  requestAnimationFrame(loop);

  drawBg();

  if (!gameOver) {
    maybeSpawn(now);

    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.update();
      if (f.alive) f.draw();
      if (f.offScreen()) {
        if (f.alive) {
          misses++;
          missFlash = 1;
          popups.push(new Popup(f.x, H - 60, '✗', '#ff4455'));
          if (misses >= MAX_MISSES) gameOver = true;
        }
        fruits.splice(i, 1);
      }
    }

    drawTrail();

    for (let i = halves.length - 1; i >= 0; i--) {
      halves[i].update(); halves[i].draw();
      if (halves[i].done()) halves.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(); particles[i].draw();
      if (particles[i].done()) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].update(); popups[i].draw();
      if (popups[i].done()) popups.splice(i, 1);
    }

    missFlash = Math.max(0, missFlash - 0.04);
    drawMissFlash();
    drawUI();

  } else {
    // Let existing particles/halves finish
    drawTrail();
    for (let i = halves.length - 1; i >= 0; i--) {
      halves[i].update(); halves[i].draw();
      if (halves[i].done()) halves.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(); particles[i].draw();
      if (particles[i].done()) particles.splice(i, 1);
    }
    drawGameOver();
  }

  // Prune stale trail
  const t = Date.now();
  trail = trail.filter(p => t - p.t < 280);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
